<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><title>Essai de schémas d'exercice</title>
<style>
  body { margin: 0; background: #fbf8f1; font-family: "Inter", system-ui, sans-serif; color: #2b2116; }
  .planche { display: grid; grid-template-columns: repeat(3, 340px); gap: 18px; padding: 24px; width: max-content; }
  figure { margin: 0; padding: 12px 12px 10px; background: #fff; border: 1px solid #e4d9c3; border-radius: 12px; }
  figcaption { margin-top: 6px; font-size: 13px; line-height: 1.35; }
  figcaption strong { display: block; font-size: 14px; margin-bottom: 2px; color: #3b2a17; }
  h1 { grid-column: 1 / -1; margin: 0; font: 500 20px/1.2 Georgia, serif; color: #3b2a17; }
  h2 { grid-column: 1 / -1; margin: 6px 0 -6px; font: 600 11px/1 sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #8a6b2a; }
  svg { display: block; width: 316px; height: 250px; }
  .corps { fill: none; stroke: #3b2a17; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  .corps-loin { fill: none; stroke: #a8957a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .tete { fill: #3b2a17; }
  .sol { stroke: #c9b896; stroke-width: 2; }
  .meuble { fill: #efe4cf; stroke: #c9b896; stroke-width: 2; }
  .fleche { fill: none; stroke: #b48a4a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .pointe { fill: #b48a4a; }
  .note { font: 600 11px sans-serif; fill: #8a6b2a; }
  .peau { fill: #f3e7d3; stroke: #3b2a17; stroke-width: 3; stroke-linejoin: round; }
  .peau-loin { fill: #e9dcc6; stroke: #8f7c62; stroke-width: 3; stroke-linejoin: round; }
  .pli { fill: none; stroke: #8f7c62; stroke-width: 2; stroke-linecap: round; }
  .ct { fill: none; stroke: #3b2a17; stroke-linecap: round; stroke-linejoin: round; }
  .rp { fill: none; stroke: #f3e7d3; stroke-linecap: round; stroke-linejoin: round; }
  .ct-loin { fill: none; stroke: #8f7c62; stroke-linecap: round; stroke-linejoin: round; }
  .rp-loin { fill: none; stroke: #e9dcc6; stroke-linecap: round; stroke-linejoin: round; }
  .serviette { fill: #e6d3ad; stroke: #b48a4a; stroke-width: 2; }
</style></head>
<body>
<div class="planche">
<h1>Essai de schémas d'exercice : personnage et mains simplifiés, même style partout</h1>
<h2>Exercices simples</h2>

<!-- 1. Étirement du mollet au mur -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Étirement du mollet au mur">
  <defs><marker id="m1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="meuble" x="268" y="30" width="18" height="200"/>
  <line class="sol" x1="20" y1="230" x2="300" y2="230"/>
  <!-- jambe arrière tendue, talon au sol -->
  <polyline class="corps" points="160,140 128,184 98,224 120,226"/>
  <!-- jambe avant fléchie -->
  <polyline class="corps" points="160,140 202,172 206,224 226,226"/>
  <!-- tronc penché vers le mur, tête -->
  <line class="corps" x1="160" y1="140" x2="206" y2="80"/>
  <circle class="tete" cx="222" cy="60" r="14"/>
  <!-- bras tendus, mains au mur -->
  <polyline class="corps" points="206,82 238,92 262,86"/>
  <!-- flèche : étirement du mollet arrière -->
  <path class="fleche" d="M78 178 Q70 200 84 214" marker-end="url(#m1)"/>
  <text class="note" x="24" y="172">mollet étiré</text>
  <text class="note" x="64" y="246">talon au sol</text>
</svg><figcaption><strong>Étirement du mollet au mur</strong>Mains au mur, jambe arrière tendue, talon au sol ; pliez le genou avant jusqu'à sentir l'étirement du mollet. Tenez 30 secondes.</figcaption></figure>

<!-- 2. Pendule de l'épaule -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Pendule de l'épaule">
  <defs><marker id="m2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <line class="sol" x1="20" y1="230" x2="300" y2="230"/>
  <!-- table -->
  <rect class="meuble" x="22" y="146" width="96" height="10"/><line class="sol" x1="32" y1="156" x2="32" y2="230"/><line class="sol" x1="108" y1="156" x2="108" y2="230"/>
  <!-- jambes -->
  <polyline class="corps" points="214,150 214,190 212,224 192,226"/>
  <!-- tronc penché vers l'avant, tête -->
  <line class="corps" x1="214" y1="150" x2="142" y2="122"/>
  <circle class="tete" cx="122" cy="112" r="14"/>
  <!-- bras d'appui sur la table (plus loin) -->
  <polyline class="corps-loin" points="146,124 128,134 106,142"/>
  <!-- bras qui pend, détendu -->
  <polyline class="corps" points="144,126 145,166 146,204"/>
  <!-- petits cercles -->
  <ellipse class="fleche" cx="146" cy="214" rx="24" ry="7" stroke-dasharray="58 12"/>
  <path class="fleche" d="M168 210 L171 214" marker-end="url(#m2)"/>
  <text class="note" x="112" y="246">petits cercles avec le corps</text>
</svg><figcaption><strong>Pendule de l'épaule</strong>Penché vers l'avant, une main sur la table, laissez pendre le bras douloureux et faites de petits cercles avec le corps, sans forcer avec l'épaule.</figcaption></figure>

<!-- 3. Contraction du quadriceps -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Contraction du quadriceps, serviette sous le genou">
  <defs><marker id="m3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="meuble" x="14" y="196" width="290" height="10"/>
  <!-- jambe pliée (plus loin) -->
  <polyline class="corps-loin" points="146,184 186,146 222,184 240,186"/>
  <!-- tête et tronc couchés -->
  <circle class="tete" cx="36" cy="174" r="14"/>
  <line class="corps" x1="60" y1="182" x2="146" y2="184"/>
  <polyline class="corps" points="64,182 96,186 124,186"/>
  <!-- serviette roulée sous le genou -->
  <circle class="serviette" cx="204" cy="186" r="9"/>
  <!-- jambe tendue, orteils vers le haut -->
  <polyline class="corps" points="146,184 204,174 262,182 268,162"/>
  <!-- flèche : pousser le genou vers la serviette -->
  <path class="fleche" d="M204 126 L204 160" marker-end="url(#m3)"/>
  <text class="note" x="128" y="118">genou vers la serviette</text>
  <text class="note" x="222" y="138">orteils</text><text class="note" x="222" y="150">vers vous</text>
</svg><figcaption><strong>Contraction du quadriceps</strong>Couché, une serviette roulée sous le genou : poussez le genou vers la serviette en serrant la cuisse, orteils tirés vers vous. Tenez 5 secondes.</figcaption></figure>

<h2>Doigt à ressaut (fiche 12, poignet et main)</h2>

<!-- 4. Glissement doux sans accrochage (crochet) -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Glissement doux sans accrochage, position du crochet">
  <defs><marker id="m4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <text class="note" x="22" y="52">1. Départ : doigts droits</text>
  <g><path class="ct" stroke-width="32" d="M22 86 H126"/><path class="ct" stroke-width="20" d="M126 86 H158 H180 H196"/>
  <path class="rp" stroke-width="26" d="M22 86 H126"/><path class="rp" stroke-width="14" d="M126 86 H158 H180 H196"/></g>
  <path class="pli" d="M158 80 v12 M180 81 v10"/>
  <path class="fleche" d="M210 96 Q232 128 206 150" marker-end="url(#m4)"/>
  <text class="note" x="22" y="152">2. Crochet</text>
  <g><path class="ct" stroke-width="32" d="M22 186 H126"/><path class="ct" stroke-width="20" d="M126 186 H160 V212 L146 220"/>
  <path class="rp" stroke-width="26" d="M22 186 H126"/><path class="rp" stroke-width="14" d="M126 186 H160 V212 L146 220"/></g>
  <path class="pli" d="M154 180 l8 8 M154 206 l8 0"/>
  <text class="note" x="182" y="200">base du doigt droite,</text>
  <text class="note" x="182" y="214">bout du doigt plié</text>
  <text class="note" x="182" y="228">vers la paume</text>
</svg><figcaption><strong>Glissement doux sans accrochage (crochet)</strong>Main ouverte, doigts droits, puis pliez doucement les deux dernières phalanges en gardant la base du doigt droite ; arrêtez avant le clic. 10 répétitions lentes, 2 à 3 fois par jour.</figcaption></figure>

<!-- 5. Étirement passif doux en extension -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Étirement passif doux en extension">
  <defs><marker id="m5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="meuble" x="10" y="178" width="296" height="12"/>
  <g><path class="ct" stroke-width="30" d="M16 160 L148 162"/><path class="ct" stroke-width="20" d="M148 166 L176 167 L196 168 L210 168"/>
     <path class="rp" stroke-width="24" d="M16 160 L148 162"/><path class="rp" stroke-width="14" d="M148 166 L176 167 L196 168 L210 168"/></g>
  <path class="pli" d="M176 161 v12 M196 162 v12"/>
  <g><path class="ct-loin" stroke-width="30" d="M306 52 L258 92 L232 116"/><path class="ct-loin" stroke-width="19" d="M232 116 L214 136 L200 152"/>
     <path class="rp-loin" stroke-width="24" d="M306 52 L258 92 L232 116"/><path class="rp-loin" stroke-width="13" d="M232 116 L214 136 L200 152"/></g>
  <path class="fleche" d="M168 104 L168 146" marker-end="url(#m5)"/>
  <text class="note" x="60" y="96">doucement, 15 secondes</text>
</svg><figcaption><strong>Étirement passif doux en extension</strong>Main posée sur une table, paume vers le bas. Si le doigt reste plié, allongez-le doucement à plat avec l'autre main et tenez 15 secondes. 3 à 5 répétitions, 2 fois par jour.</figcaption></figure>

<!-- 6. Massage doux de la paume à la base du doigt -->
<figure><svg viewBox="0 0 316 250" role="img" aria-label="Massage doux de la paume à la base du doigt">
  <defs><marker id="m6" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pointe" d="M0 0 10 5 0 10z"/></marker></defs>
  <g><path class="ct" stroke-width="62" d="M138 202 L138 248"/><path class="ct" stroke-width="80" d="M138 146 L138 178"/><path class="ct" stroke-width="23" d="M109 128 L109 62 M129 126 L129 48 M149 128 L149 56 M168 134 L168 78"/><path class="ct" stroke-width="25" d="M106 182 L82 154 L68 130"/>
     <path class="rp" stroke-width="56" d="M138 202 L138 248"/><path class="rp" stroke-width="74" d="M138 146 L138 178"/><path class="rp" stroke-width="17" d="M109 128 L109 62 M129 126 L129 48 M149 128 L149 56 M168 134 L168 78"/><path class="rp" stroke-width="19" d="M106 182 L82 154 L68 130"/></g>
  <path class="pli" d="M100 130 q10 4 20 0 M120 128 q10 4 20 0 M140 130 q10 4 20 0 M158 136 q8 3 16 0"/>
  <g><path class="ct-loin" stroke-width="26" d="M250 168 L208 150 L146 136"/><path class="rp-loin" stroke-width="20" d="M250 168 L208 150 L146 136"/></g>
  <circle class="fleche" cx="132" cy="132" r="15" stroke-dasharray="70 24"/>
  <path class="fleche" d="M145 124 L147 129" marker-end="url(#m6)"/>
  <text class="note" x="188" y="64">petits cercles doux</text>
  <text class="note" x="188" y="78">à la base du doigt,</text>
  <text class="note" x="188" y="92">avec l'autre pouce</text>
</svg><figcaption><strong>Massage doux de la paume à la base du doigt (facultatif)</strong>Main posée paume vers le haut : avec le pouce de l'autre main, faites de petits cercles doux sur le point sensible à la base du doigt. 1 à 2 minutes, 1 à 2 fois par jour.</figcaption></figure>
</div>
</body></html>
